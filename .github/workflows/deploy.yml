name: Deploy

# Публикует страницу на GitHub Pages: при пуше в main, раз в сутки
# (чтобы обновились счётчики звёзд и таблица рекордов) и по кнопке.

"on":
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # снимок таблицы рекордов коммитится этим же прогоном
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Версии actions — на Node 24: сверено по тегам и action.yml 2026-09-24.
      # Прежние checkout@v4, setup-python@v5, configure-pages@v5 и
      # deploy-pages@v4 были на Node 20, который GitHub снимает с раннеров.
      - uses: actions/checkout@v7

      # Проверки идут тем Node, на котором их пишут и гоняют локально (v24),
      # а не тем, что окажется в образе раннера.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Существ глазами не проверить: в панели предпросмотра кадры не считаются
      # вовсе, а ветка `prefers-reduced-motion` в обычном режиме не исполняется —
      # там уже жил дефект, из-за которого Оливия не появлялась совсем. Прогон
      # крутит `pet.js` вхолостую под заглушками браузера, `--selftest` следом
      # проверяет саму проверку. Красный прогон останавливает выкладку.
      - name: Прогнать существ и тетрис
        run: |
          node tools/check_pet.js
          node tools/check_pet.js --selftest
          node tools/check_tetris.js

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Сборщики без внешней сети: разбор таблицы рекордов и её сбои, звёзды
      # при сбоях GitHub, метка выпуска, папка сайта. Красный — выкладки нет.
      - name: Проверить сборщики
        run: |
          python tools/check_records.py
          python tools/check_publish.py

      # Общая десятка рекордов тетриса — снимок опубликованной таблицы ответов
      # Google-формы. В отличие от звёзд, снимок коммитится: меняется он редко,
      # а при недоступной таблице на сайте остаётся вчерашняя десятка, не
      # пустая. Пуш токеном прогона нового прогона не запускает — и не нужно:
      # этот же прогон выложит страницу со свежим файлом. Не прошёл пуш
      # (кто-то запушил раньше) — файл всё равно уедет на сайт, коммит
      # повторится следующим прогоном.
      # Шаг необязательный (с 5.79): сбой Google или чужая строка в открытой
      # форме не держат выкладку правок резюме. Сеть не ответила — код 0 и
      # вчерашняя десятка; таблица поменяла вид — код 1, и прогон покраснеет
      # последним шагом, уже после выкладки.
      - name: Обновить таблицу рекордов
        id: records
        continue-on-error: true
        run: |
          python scripts/fetch_records.py
          if git diff --quiet -- data/records.js; then
            echo "Таблица рекордов не изменилась"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/records.js
            git commit -m "Таблица рекордов: снимок $(date -u +%F)"
            git push origin HEAD:main || echo "Пуш не прошёл — снимок уедет на сайт и так"
          fi

      # Счётчики звёзд подставляются на лету — в репозитории они не хранятся,
      # поэтому история не засоряется коммитами бота. Шаг необязательный по
      # той же причине: без GitHub API страница просто не покажет счётчиков.
      - name: Обновить счётчики проектов
        id: stats
        continue-on-error: true
        run: python scripts/fetch_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Метка выпуска в адресах стилей и скриптов. Без неё браузер держит
      # старый `pet.js` до десяти минут и дольше, и свежая правка доходит не
      # сразу — на это уже жаловался владелец.
      - name: Подписать стили и скрипты меткой выпуска
        run: python tools/stamp_assets.py

      # Английская версия — отдельный файл со своими мета-тегами: поисковик и
      # превью ссылки не выполняют скрипт и русского заголовка не увидят.
      - name: Собрать английскую копию страницы
        run: python tools/build_en.py

      - name: Собрать однофайловую версию
        run: python tools/build_single.py

      # На сайт уходит только папка сайта: страницы, assets/, data/ и
      # однофайловая версия. До 5.79 публиковался весь репозиторий — со
      # спецификацией, README, инструментами и .pyc. Битая локальная ссылка в
      # собранной папке — красный, выкладки нет.
      - name: Собрать папку сайта
        run: python tools/build_site.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

      # Сайт уже выложен. Если рекорды или счётчики не обновились по причине,
      # которую надо увидеть, прогон заканчивается красным — бейдж скажет.
      - name: Данные обновились
        if: steps.records.outcome == 'failure' || steps.stats.outcome == 'failure'
        run: |
          echo "::error::Сайт выложен, но данные не обновились: рекорды — ${{ steps.records.outcome }}, звёзды — ${{ steps.stats.outcome }}"
          exit 1
