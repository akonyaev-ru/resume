name: Deploy

# Публикует страницу на GitHub Pages: при пуше в main, раз в сутки
# (чтобы обновились счётчики звёзд) и по кнопке.

"on":
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Счётчики звёзд подставляются на лету — в репозитории они не хранятся,
      # поэтому история не засоряется коммитами бота.
      - name: Обновить счётчики проектов
        run: python scripts/fetch_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Английская версия — отдельный файл со своими мета-тегами: поисковик и
      # превью ссылки не выполняют скрипт и русского заголовка не увидят.
      - name: Собрать английскую копию страницы
        run: python tools/build_en.py

      - name: Собрать однофайловую версию
        run: python tools/build_single.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4
